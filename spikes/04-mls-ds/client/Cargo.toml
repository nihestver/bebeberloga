# Спайк S4: клиенты на OpenMLS для e2e-проверки и нагрузки DS. Отдельный workspace.
[workspace]

[package]
name = "s4-client"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
description = "Спайк S4: устройства на OpenMLS против прототипа Delivery Service"

[dependencies]
# Версии закреплены точно, как в S1 (ADR-0016 п. 1).
openmls = { version = "=0.9.2", default-features = false }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
tls_codec = "=0.5.0"
# ключ external sender-а из seed для golden-векторов
ed25519-dalek = "=2.2.0"
serde_json = "=1.0.154"
base64ct = { version = "=1.8.3", features = ["alloc"] }

[profile.release]
debug = 1
