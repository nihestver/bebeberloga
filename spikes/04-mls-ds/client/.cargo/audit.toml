# cargo audit: те же игноры с теми же обоснованиями, что в deny.toml.
[advisories]
ignore = [
  "RUSTSEC-2026-0387", # crypto-bigint через p256: P-256 не используется ciphersuite 0x0001
  "RUSTSEC-2026-0173", # proc-macro-error2: proc-macro этапа компиляции
  # libcrux-kem 0.0.9 попадает в Cargo.lock через необязательную фичу (libcrux-провайдер),
  # но не собирается ни в одной конфигурации: `cargo tree -i libcrux-kem --target all --edges all` пуст.
  "RUSTSEC-2026-0331",
  "RUSTSEC-2026-0330",
]
