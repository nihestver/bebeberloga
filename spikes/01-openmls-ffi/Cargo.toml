# Спайк S1: отдельный workspace, не часть продуктового кода.
[workspace]
resolver = "2"
members = ["mls-core", "node-ffi", "uniffi-ffi"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Версии закреплены точно (ограничение спайка).
openmls = { version = "=0.9.2", default-features = false }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
tls_codec = "=0.5.0"
thiserror = "=2.0.17"

[profile.release]
debug = 1
