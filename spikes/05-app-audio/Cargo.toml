# Спайк S5: отдельный пакет, не часть продуктового кода. Пустая таблица [workspace]
# делает его самостоятельным, даже если в корне репозитория появится общий workspace.
[workspace]

[package]
name = "s5-app-audio"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
description = "Спайк S5: звук приложения и захват видео на трёх ОС"

[lib]
name = "s5"
path = "src/lib.rs"

[[bin]]
name = "s5cap"
path = "src/bin/s5cap.rs"

[[bin]]
name = "s5src"
path = "src/bin/s5src.rs"

# Версии прямых зависимостей закреплены точно (ограничение спайка).
[dependencies]
clap = { version = "=4.6.9", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
hound = "=3.5.1"
png = "=0.18.1"
# звук тестового источника и «собственный» тон программы захвата
cpal = "=0.18.2"
# окно тестового источника
winit = "=0.30.13"
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-screen-capture-kit = "=0.3.2"
objc2-core-media = "=0.3.2"
objc2-core-video = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-audio = "=0.3.2"
objc2-core-audio-types = "=0.3.2"

[target.'cfg(windows)'.dependencies]
# макрос implement разворачивается в пути ::windows_core
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# тестовый источник умеет выводить звук тремя путями: ALSA, протокол PulseAudio, PipeWire
cpal = { version = "=0.18.2", features = ["pipewire", "pulseaudio"] }
pipewire = "=0.10.1"
# исполнитель zbus встроенный (async-io): спайку не нужен tokio
ashpd = { version = "=0.14.3", default-features = false, features = ["async-io", "screencast", "inhibit"] }
x11rb = "=0.14.0"

[profile.release]
debug = 1
