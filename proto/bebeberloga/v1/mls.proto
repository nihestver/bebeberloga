// Delivery Service MLS: группы, handshake-сообщения, Welcome, связки ключей истории,
// карта состава, журнал оператора и пересоздание группы. Сервер хранит и упорядочивает непрозрачные
// блобы (ARCHITECTURE.md §4.3, ADR-0015); их формат и правила DS задаёт
// docs/protocol/CRYPTO.md (§1–§2). External commit и GroupInfo в 1.0 не используются (ADR-0019).
syntax = "proto3";

package bebeberloga.v1;

import "google/protobuf/timestamp.proto";

// Роль группы по отношению к каналу.
enum GroupKind {
  GROUP_KIND_UNSPECIFIED = 0;
  // Постоянная группа чата: DM, групповой чат, текстовый канал, чат голосового канала.
  GROUP_KIND_CHAT = 1;
  // Короткоживущая группа звонка голосового канала или ЛС.
  GROUP_KIND_CALL = 2;
  // Личная группа пользователя: все его устройства (CRYPTO.md §6.5).
  GROUP_KIND_PERSONAL = 3;
}

// Изменение ключа истории в commit-е (`RosterDelta.history_change`, CRYPTO.md §6.3.3).
// Значение здесь = значение в RosterDelta + 1: нуль занят UNSPECIFIED (CRYPTO.md §2.3).
enum HistoryChange {
  HISTORY_CHANGE_UNSPECIFIED = 0;
  HISTORY_CHANGE_NONE = 1;
  // Новое поколение со ссылкой назад: Remove (кроме пары возврата того же устройства), срок 30 сут.
  HISTORY_CHANGE_ROTATE = 2;
  // Разрыв: вход нового пользователя при выключенной настройке «Новые участники видят историю».
  HISTORY_CHANGE_BREAK_NEW_MEMBER = 3;
  // Разрыв: настройку снова включили.
  HISTORY_CHANGE_BREAK_ENABLE = 4;
  // Разрыв: вход устройства пользователя со сменившимся ключом идентичности.
  HISTORY_CHANGE_BREAK_RESET = 5;
  // Разрыв: начальный commit пересозданной группы (CRYPTO.md §6.3.10).
  HISTORY_CHANGE_BREAK_RECREATE = 6;
  // Разрыв: настройку выключили или канал создан с выключенной настройкой; дальше история по цепочке
  // считается выключенной до HISTORY_CHANGE_BREAK_ENABLE (CRYPTO.md §6.3.3).
  HISTORY_CHANGE_BREAK_DISABLE = 7;
}

// Состояние группы на DS (CRYPTO.md §2.10).
enum GroupState {
  GROUP_STATE_UNSPECIFIED = 0;
  // Обычная работа.
  GROUP_STATE_ACTIVE = 1;
  // Заморожена и ждёт пересоздания (CRYPTO.md §2.10, §2.14): по команде оператора, для
  // восстановления личной группы или, у группы звонка, на время создания новой группы звонка
  // (около 1 с, заморожен только handshake, медиа идут).
  GROUP_STATE_FROZEN = 2;
  // Заменена новой группой канала или звонка (`successor_group_id`); ничего не принимает.
  GROUP_STATE_SUPERSEDED = 3;
  // 4 — бывшее GROUP_STATE_REVIEW (проверка спорного commit-а): снято, голосования по жалобам нет
  // (ADR-0021 п. 17).
  reserved 4;
  reserved "GROUP_STATE_REVIEW";
}

// Почему группа заморожена и пересоздаётся (CRYPTO.md §2.10.1).
enum RecreationReason {
  RECREATION_REASON_UNSPECIFIED = 0;
  // Команда оператора «пересоздать канал от группы P и эпохи E с создателем X» по записям журнала
  // (CRYPTO.md §2.10.1); клиентам допустим откат эпох до E. У группы звонка — новая группа звонка по
  // записи о дефектном commit-е, застою или `local_epoch` впереди DS (§5.1).
  RECREATION_REASON_DISPUTE = 1;
  // Та же команда после восстановления базы DS из копии (CRYPTO.md §2.10.9); клиентам допустим
  // откат эпох.
  RECREATION_REASON_JOURNAL_LOSS = 2;
  // В личной группе не осталось устройств, кроме удаляемых; устройство, восстановленное ключом
  // восстановления, пересоздаёт её из резервной копии (CRYPTO.md §2.10.1, §6.5).
  RECREATION_REASON_PERSONAL_RESTORE = 3;
}

// Состояние группы на сервере.
message Group {
  // Id группы (MLS group_id), сгенерирован создателем.
  string id = 1;
  string channel_id = 2;
  GroupKind kind = 3;
  // Код ciphersuite MLS; в 1.0 только 0x0001.
  uint32 ciphersuite = 4;
  uint64 epoch = 5;
  uint32 device_count = 6;
  // Последний присвоенный номер handshake.
  uint64 last_seq = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_rotation_at = 9;
  // Не используется в 1.0: GroupInfo сервер не хранит (ADR-0019). Всегда false.
  bool has_group_info = 10 [deprecated = true];
  // Есть связка ключей истории для текущей эпохи.
  bool has_history_key_bundle = 11;
  GroupState state = 12;
  // Группа, которую эта заменила при пересоздании; пусто у первой группы канала.
  string predecessor_group_id = 13;
  // Группа, которая заменила эту (только при GROUP_STATE_SUPERSEDED).
  string successor_group_id = 14;
  // Хэш состава текущей эпохи по карте DS (CRYPTO.md §2.5), 32 байта.
  bytes roster_hash = 15;
  // 16 — бывшее review_seq, 18 — бывшее recreation_deferred_until: сняты вместе с голосованием по
  // жалобам и лимитом пересозданий (ADR-0021 п. 17).
  reserved 16, 18;
  reserved "review_seq", "recreation_deferred_until";
  // При GROUP_STATE_FROZEN и GROUP_STATE_SUPERSEDED: почему группа пересоздаётся.
  RecreationReason recreation_reason = 17;
  // Текущее поколение ключа истории канала (CRYPTO.md §6.3); сообщения обязаны быть обёрнуты им.
  uint32 history_key_generation = 19;
}

enum HandshakeKind {
  HANDSHAKE_KIND_UNSPECIFIED = 0;
  // Предложение. От клиентов в 1.0 не принимается (UNAUTHORIZED_CHANGE): предложения
  // публикует только сервер как external sender (CRYPTO.md §2.2).
  HANDSHAKE_KIND_PROPOSAL = 1;
  HANDSHAKE_KIND_COMMIT = 2;
  // Не используется в 1.0 (ADR-0019): DS отвечает EXTERNAL_COMMIT_UNSUPPORTED.
  HANDSHAKE_KIND_EXTERNAL_COMMIT = 3 [deprecated = true];
}

// Handshake-сообщение MLS (Proposal или Commit), упорядоченное сервером по группе.
message Handshake {
  string group_id = 1;
  // Эпоха, в которой сообщение создано.
  uint64 epoch = 2;
  // Порядковый номер в группе (сквозной по эпохам, с 1).
  uint64 seq = 3;
  HandshakeKind kind = 4;
  // Устройство-отправитель; пусто, если отправитель — сервер как external sender.
  string sender_device_id = 5;
  bool from_external_sender = 6;
  // Формат блоба по RFC 9420: commit участника — PrivateMessage (§6.3; handshake участников
  // всегда зашифрованы, ADR-0016 п. 2); предложение сервера как external sender —
  // PublicMessage (§6.2) с ProposalAAD в authenticated_data (CRYPTO.md §2.3). Сервер читает
  // только открытый заголовок (group_id, epoch, content_type, authenticated_data, тип
  // отправителя у PublicMessage). В событии gateway пусто, если больше 256 КиБ, — тогда клиент
  // забирает `GET /mls/groups/{id}/handshakes/{seq}`.
  bytes blob = 7;
  google.protobuf.Timestamp created_at = 8;
  // Для commit: хэш состава после него по карте DS (CRYPTO.md §2.5), 32 байта. Клиент сверяет
  // его с хэшем своего дерева после merge.
  bytes roster_hash = 9;
  // Для commit: изменение ключа истории и поколение после него (CRYPTO.md §6.3.3).
  HistoryChange history_change = 10;
  uint32 history_key_generation = 11;
}

// Welcome для устройства (RFC 9420 §12.4.3.1).
message Welcome {
  string group_id = 1;
  // Канал, которому принадлежит группа, и её роль.
  string channel_id = 2;
  GroupKind kind = 3;
  // В событии gateway пусто, если больше 256 КиБ, — тогда `GET /mls/welcomes`.
  bytes blob = 4;
  google.protobuf.Timestamp created_at = 5;
  // Эпоха, в которую вводит Welcome, и номер commit-а, который его создал (для записи в журнал,
  // CRYPTO.md §1.8, §2.9).
  uint64 epoch = 6;
  uint64 seq = 7;
  // Мост: ключи истории через разрывы цепочки, HPKE на ключ истории устройства
  // (CRYPTO.md §6.3.6); пусто, если не нужен.
  bytes history_bridge = 8;
}

// Связка ключей истории канала — головной ключ, зашифрованный для эпохи группы
// (CRYPTO.md §6.3.5; ADR-0015, ADR-0020).
message HistoryKeyBundle {
  string group_id = 1;
  uint64 epoch = 2;
  bytes blob = 3;
  google.protobuf.Timestamp updated_at = 4;
  // Головное поколение — открыто, DS сверяет его с текущим поколением канала.
  uint32 generation = 5;
}

// Ссылка цепочки ключей истории: ключ поколения `previous_generation`, зашифрованный подключом
// поколения `generation` (CRYPTO.md §6.3.4). У разрывов ссылки нет.
message HistoryKeyLink {
  string channel_id = 1;
  uint32 generation = 2;
  uint32 previous_generation = 3;
  bytes blob = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Поколение ключа истории канала по данным DS (CRYPTO.md §6.3.7 п. 2): когда и чем начато.
message HistoryGenerationInfo {
  string channel_id = 1;
  uint32 generation = 2;
  // Время приёма DS commit-а, начавшего поколение.
  google.protobuf.Timestamp started_at = 3;
  HistoryChange change = 4;
  string group_id = 5;
  uint64 epoch = 6;
}

// Мост для устройства, которое входит commit-ом (CRYPTO.md §6.3.6).
message HistoryBridge {
  string device_id = 1;
  bytes blob = 2;
}

// Не используется в 1.0: GroupInfo сервер не хранит и не публикует (ADR-0019).
message EncryptedGroupInfo {
  option deprecated = true;

  string group_id = 1;
  uint64 epoch = 2;
  bytes blob = 3;
}

// Запись карты состава: лист → устройство (CRYPTO.md §2.5).
message RosterEntry {
  uint32 leaf = 1;
  string device_id = 2;
}

// Состав группы по карте DS в эпохе.
message Roster {
  string group_id = 1;
  uint64 epoch = 2;
  // Непустые листья по возрастанию `leaf`.
  repeated RosterEntry entries = 3;
  // SHA-256 от RosterHashInput (CRYPTO.md §2.5), 32 байта.
  bytes roster_hash = 4;
}

// Причина записи клиента в журнал оператора о commit-е или Welcome, который он не смог применить
// (CRYPTO.md §2.9.2). На состояние группы запись не влияет; причина — для оператора и диагностики.
// В группе звонка та же запись — сигнал DS завести новую группу звонка (§5.1).
enum DisputeReason {
  DISPUTE_REASON_UNSPECIFIED = 0;
  // RosterDelta не совпадает с действием commit-а или флагами.
  DISPUTE_REASON_DELTA_MISMATCH = 1;
  // В commit нет объявленного сервером Remove.
  DISPUTE_REASON_MISSING_REMOVE = 2;
  // Добавленный лист не прошёл проверку credential или добавлен не по предложению сервера.
  DISPUTE_REASON_UNAUTHORIZED_ADD = 3;
  // UpdatePath или Update сменили credential или ключ подписи листа.
  DISPUTE_REASON_LEAF_CREDENTIAL_CHANGED = 4;
  // Запрещённое предложение: GroupContextExtensions (кроме замены ключа инстанса), PSK, ReInit,
  // ExternalInit, предложение участника.
  DISPUTE_REASON_FORBIDDEN_PROPOSAL = 5;
  // Commit текущей эпохи не расшифровывается или не проходит проверки MLS при полном
  // состоянии клиента.
  DISPUTE_REASON_UNDECRYPTABLE = 6;
  // Состав после merge или из Welcome не совпадает с картой DS.
  DISPUTE_REASON_ROSTER_MISMATCH = 7;
  // Расширения группы (group_binding, external_senders, required_capabilities) не те.
  DISPUTE_REASON_BINDING_MISMATCH = 8;
  // Срок KeyPackage в Add истёк по часам клиента, хотя commit моложе горизонта офлайна.
  DISPUTE_REASON_KEY_PACKAGE_EXPIRED = 9;
  // Пересозданная группа не прошла проверки законности (CRYPTO.md §2.10.6).
  DISPUTE_REASON_RECREATION_INVALID = 10;
  // Нет обязательной ротации или разрыва ключа истории (CRYPTO.md §6.3.3).
  DISPUTE_REASON_HISTORY_ROTATION_MISSING = 11;
  // Ссылка цепочки ключей истории не расшифровывается в предыдущий ключ (CRYPTO.md §6.3.4).
  DISPUTE_REASON_HISTORY_LINK_INVALID = 12;
}

// План пересоздания группы для назначенного создателя (CRYPTO.md §2.10.4).
message RecreationPlan {
  string old_group_id = 1;
  string channel_id = 2;
  GroupKind kind = 3;
  // Последняя согласованная эпоха старой группы.
  uint64 last_agreed_epoch = 4;
  // Поколение ключа истории, действовавшее в `last_agreed_epoch` (для тега непрерывности);
  // 0 у групп звонков.
  uint32 history_key_generation = 5;
  // Начальный состав новой группы R₀: устройства старой группы в `last_agreed_epoch` без удалённых
  // (CRYPTO.md §2.10.3). Остальные устройства целевого состава входят следующим Add.
  repeated string target_device_ids = 6;
  // Причина пересоздания: от неё зависит проверка точки согласия у клиентов (CRYPTO.md §2.10.6).
  RecreationReason reason = 7;
  // Номер поколения ключа истории, которое начнёт новая группа (CRYPTO.md §6.3.10): при DISPUTE и
  // PERSONAL_RESTORE — ровно он, при JOURNAL_LOSS — не больше next_generation + 65 536.
  uint32 next_generation = 8;
}
