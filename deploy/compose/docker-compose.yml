#
# Bebeberloga одним файлом для небольшого инстанса (ARCHITECTURE.md §5.5): сервер, PostgreSQL,
# Valkey, NATS JetStream и Caddy с автоматическим TLS. Этот же файл работает на тест-сервере.
#
#   ./init-env.sh            # .env со случайными паролями; домен — BB_DOMAIN в .env
#   docker compose up -d
#
# Установка и переменные — deploy/README.md и .env.example. Оверлеи: compose.dev.yml
# (локальная разработка) и compose.agent.yml (стенд агента и CI).
#
# Чего здесь пока нет: S3-хранилище (Garage, ADR-0022) появится вместе с модулем files (B06);
# livekit и coturn — в B07 (место отмечено ниже); миграции БД (`migrate`) — в B04.

name: bebeberloga

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  server:
    <<: *defaults
    image: ${BB_SERVER_IMAGE:-ghcr.io/nihestver/bebeberloga/server:main}
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    environment:
      BB_HTTP_ADDR: ":8080"
      BB_LOG_LEVEL: ${BB_LOG_LEVEL:-info}
      # Пароли подставляются в URL как есть, поэтому в них допустимы только буквы и цифры (.env.example).
      BB_DATABASE_URL: postgres://bebeberloga:${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env или запусти ./init-env.sh}@postgres:5432/bebeberloga?sslmode=disable
      BB_VALKEY_URL: redis://:${VALKEY_PASSWORD:?задай VALKEY_PASSWORD в .env или запусти ./init-env.sh}@valkey:6379/0
      BB_NATS_URL: nats://bebeberloga:${NATS_PASSWORD:?задай NATS_PASSWORD в .env или запусти ./init-env.sh}@nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - edge
      - backend
    stop_grace_period: 20s
    mem_limit: ${BB_MEM_SERVER:-0}

  postgres:
    <<: *defaults
    image: postgres:16.15
    environment:
      POSTGRES_USER: bebeberloga
      POSTGRES_DB: bebeberloga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env или запусти ./init-env.sh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U bebeberloga -d bebeberloga"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - backend
    stop_grace_period: 1m
    mem_limit: ${BB_MEM_POSTGRES:-0}

  valkey:
    <<: *defaults
    image: valkey/valkey:8.1.11-alpine
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?задай VALKEY_PASSWORD в .env или запусти ./init-env.sh}
      - --appendonly
      - "yes"
    environment:
      # для valkey-cli в healthcheck: пароль не попадает в аргументы команды
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?задай VALKEY_PASSWORD в .env или запусти ./init-env.sh}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - backend
    mem_limit: ${BB_MEM_VALKEY:-0}

  nats:
    <<: *defaults
    image: nats:2.15.2-alpine
    # JetStream с хранением на томе; порт 8222 — мониторинг, нужен только healthcheck-у.
    command:
      - nats-server
      - --jetstream
      - --store_dir
      - /data
      - --http_port
      - "8222"
      - --user
      - bebeberloga
      - --pass
      - ${NATS_PASSWORD:?задай NATS_PASSWORD в .env или запусти ./init-env.sh}
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - backend
    mem_limit: ${BB_MEM_NATS:-0}

  caddy:
    <<: *defaults
    image: caddy:2.11.9-alpine
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      # Адрес сайта в Caddyfile: домен → Caddy сам получает и продлевает сертификат.
      BB_SITE_ADDRESS: ${BB_DOMAIN:?задай BB_DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    networks:
      - edge
    mem_limit: ${BB_MEM_CADDY:-0}

  # --- медиа: место для B07 ---------------------------------------------------
  # Сервисы `livekit` (SFU) и `coturn` (TURN) добавит B07 вместе с конфигурацией и ключами.
  # Порты на хосте (docs/dev/WORKFLOW.md): LiveKit — 7881/tcp и 50000–60000/udp, coturn — 3478/udp.
  # Образов здесь нет намеренно: без конфигурации сервисы не запускаются, а версии выберет B07.

volumes:
  postgres-data:
  valkey-data:
  nats-data:
  caddy-data:
  caddy-config:

networks:
  # edge: Caddy ↔ сервер и выход сервера наружу.
  edge:
  # backend: хранилища. Портов наружу нет, выхода в интернет тоже.
  backend:
    internal: true
