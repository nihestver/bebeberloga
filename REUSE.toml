version = 1
SPDX-PackageName = "Bebeberloga"
SPDX-PackageDownloadLocation = "https://github.com/nihestver/bebeberloga"

[[annotations]]
path = ["clients/**"]
SPDX-FileCopyrightText = "2026 Bebeberloga contributors"
SPDX-License-Identifier = "GPL-3.0-or-later WITH LicenseRef-Bebeberloga-AppStore-exception"

[[annotations]]
path = ["server/**", "deploy/**", "tests/**"]
SPDX-FileCopyrightText = "2026 Bebeberloga contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["crypto-core/**", "media-engine/**", "proto/**", "sdk/**", "tools/**", "design/**", "spikes/**"]
SPDX-FileCopyrightText = "2026 Bebeberloga contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["brand/**"]
SPDX-FileCopyrightText = "2026 Bebeberloga contributors"
SPDX-License-Identifier = "LicenseRef-Bebeberloga-Brand"

[[annotations]]
path = [".github/**", ".claude/**", ".vscode/**", ".gitignore", ".gitattributes", ".editorconfig", "mise.toml", "justfile", "lefthook.yml", "REUSE.toml", "LICENSE", "NOTICE",
        ".env.example", ".golangci.yml", ".markdownlint*", ".prettierrc*", "eslint.config.*", "tsconfig*.json",
        "Cargo.toml", "Cargo.lock", "deny.toml", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml",
        "go.work", "go.work.sum", "buf.yaml", "buf.gen.yaml", "buf.work.yaml", "redocly.yaml",
        "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "lychee.toml", "STATUS.md"]
SPDX-FileCopyrightText = "2026 Bebeberloga contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["docs/**", "*.md", "BRAND.md"]
SPDX-FileCopyrightText = "2026 Bebeberloga contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Исключение из docs/**: контракт REST генерирует код (ADR-0017 п. 9). Последняя подходящая таблица побеждает.
[[annotations]]
path = ["docs/protocol/openapi.yaml"]
SPDX-FileCopyrightText = "2026 Bebeberloga contributors"
SPDX-License-Identifier = "Apache-2.0"

# Исключение из design/**: собственные аватары и иконки (ADR-0013 п. 8). Последняя подходящая таблица побеждает.
[[annotations]]
path = ["design/avatars/**", "design/icons/**"]
SPDX-FileCopyrightText = "2026 nihestver <https://github.com/nihestver>"
SPDX-License-Identifier = "CC-BY-SA-4.0"
