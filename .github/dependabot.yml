# Обновления зависимостей: одна сводная PR на экосистему в неделю, сообщения — по Conventional Commits
# (проходят commit-msg из lefthook.yml). Каталоги модулей добавляются сюда вместе с самими модулями:
# на каталоге без манифеста Dependabot падает. Спайки (spikes/) одноразовые и не обновляются.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Образы в deploy/compose/ закреплены по версии; патчи и минорные версии приходят сводной PR.
  # Мажорные версии PostgreSQL (нужен pg_upgrade) и Valkey (ADR-0002) меняются только осознанно.
  - package-ecosystem: "docker-compose"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"
    groups:
      compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # С B4 (появится server/go.mod):
  # - package-ecosystem: "gomod"
  #   directory: "/server"
  #   schedule: { interval: "weekly" }
  #   groups: { go: { patterns: ["*"] } }
  #   commit-message: { prefix: "chore(deps)" }

  # С B3 (появится Cargo.toml в корне):
  # - package-ecosystem: "cargo"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #   groups: { cargo: { patterns: ["*"] } }
  #   commit-message: { prefix: "chore(deps)" }

  # Версии в clients/web/package.json закреплены точно; мажорные обновления — отдельными PR с прогоном
  # тестов клавиатуры и доступности (ADR-0023).
  - package-ecosystem: "npm"
    directory: "/clients/web"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
