name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Новый push в ветку PR отменяет её прошлый прогон; каждый прогон main доходит до конца,
# чтобы деплой на тест-сервер (deploy-test.yml) всегда видел результат проверки своего коммита.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - 'server/**'
              - 'proto/**'
            rust:
              - 'crypto-core/**'
              - 'media-engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            web:
              - 'clients/web/**'
              - 'clients/desktop/**'
              - 'design/**'
              - 'proto/**'
            proto:
              - 'proto/**'

  # Clean-room фильтр, лицензионные заголовки и реестр ассетов — на каждый PR, без исключений.
  cleanroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: forbidden words
        run: .claude/hooks/cleanroom-guard.sh --all
      - name: REUSE compliance
        uses: fsfe/reuse-action@v5
      - name: asset attribution
        run: tools/check-attribution.sh
      # shellcheck уже есть в образе ubuntu-latest
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck -S warning

  # Ссылки внутри репозитория (markdown) — на каждый PR; внешние ссылки не проверяем, чтобы CI не зависел от сети.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path LICENSES './**/*.md'
          fail: true
      - uses: extractions/setup-just@v2
      - name: OpenAPI contract
        run: just openapi

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: bebeberloga }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ['6379:6379']
      nats:
        image: nats:2
        ports: ['4222:4222']
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - uses: extractions/setup-just@v2
      - run: just lint-go test-go
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/bebeberloga?sslmode=disable
          VALKEY_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - uses: extractions/setup-just@v2
      - if: hashFiles('clients/web/package.json') != ''
        run: cd clients/web && pnpm install --frozen-lockfile
      # рецепты пропускают проверку, пока clients/web ещё нет
      - run: just lint-web test-web

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # buf breaking падает, если в базовой ветке ещё нет .proto; проверяем это заранее.
      - id: base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git ls-tree -r --name-only "origin/${{ github.base_ref }}" -- proto | grep -q '\.proto$'; then
            echo "has_proto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' && steps.base.outputs.has_proto == 'true' }}
          push: false
          pr_comment: false

  # Единственная обязательная проверка для защиты main: пропущенные по фильтру путей jobs считаются успехом,
  # упавшие или отменённые — провалом. Так защита ветки не зависит от того, какие jobs запускались.
  ci-ok:
    if: always()
    needs: [changes, cleanroom, docs, go, rust, web, proto]
    runs-on: ubuntu-latest
    steps:
      - name: all required jobs passed or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
