name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - 'server/**'
              - 'proto/**'
            rust:
              - 'crypto-core/**'
              - 'media-engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            web:
              - 'clients/web/**'
              - 'clients/desktop/**'
              - 'design/**'
              - 'proto/**'
            proto:
              - 'proto/**'

  # Clean-room фильтр и лицензионные заголовки — на каждый PR, без исключений.
  cleanroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbidden words
        run: .claude/hooks/cleanroom-guard.sh --all
      - name: REUSE compliance
        uses: fsfe/reuse-action@v5

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: bebeberloga }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ['6379:6379']
      nats:
        image: nats:2
        ports: ['4222:4222']
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: extractions/setup-just@v2
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - run: just lint-go test-go
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/bebeberloga?sslmode=disable
          VALKEY_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: cd clients/web && pnpm install --frozen-lockfile
      - run: cd clients/web && pnpm lint && pnpm typecheck && pnpm test

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: ${{ github.event_name == 'pull_request' }}
          push: false
